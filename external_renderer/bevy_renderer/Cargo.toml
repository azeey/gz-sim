[package]
name = "gz_bevy_renderer"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "3d",
    "png",
    "jpeg",
    "hdr",
    "tonemapping_luts",
    "smaa_luts",
    "area_light_luts",
    "bluenoise_texture",
    "experimental_pbr_pcss",
] }
bytemuck = { version = "1.25.2", features = ["derive"] }
crossbeam-channel = "0.5.17"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "hdr"] }
wgpu = { version = "29.0.4", default-features = false, features = ["metal"] }
wgpu-hal = { version = "29.0.4", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-metal = "0.3.2"

[build-dependencies]
cc = "1.5.1"

[profile.release]
opt-level = 3
lto = "thin"
